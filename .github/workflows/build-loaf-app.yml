# Builds the LOAF Android app (the thin shell in android/). Run it from the Actions tab: Build LOAF app > Run workflow.
# You only need to run it again when the android/ folder changes. Changes to LOAF itself reach the app with a normal upload.
name: Build LOAF app
on:
  workflow_dispatch:
    inputs:
      address:
        description: "LOAF's address (leave empty to use this repo's GitHub Pages address)"
        required: false
        default: ""
permissions:
  contents: read
  pages: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out LOAF's address
        id: url
        env:
          GH_TOKEN: ${{ github.token }}
          GIVEN: ${{ inputs.address }}
        run: |
          if [ -n "$GIVEN" ]; then url="$GIVEN"; else
            base=$(gh api "repos/${{ github.repository }}/pages" --jq .html_url 2>/dev/null || true)
            if [ -z "$base" ]; then echo "::error::GitHub Pages isn't on for this repo. Turn it on (Settings > Pages), or type LOAF's address when you run this."; exit 1; fi
            # find the folder holding LOAF's index.html (the repo root, or a folder such as loaf/)
            dir=$(grep -l "<title>LOAF</title>" $(git ls-files '*index.html') 2>/dev/null | grep -v '^android/' | head -1 | xargs -r dirname)
            if [ -z "$dir" ]; then echo "::error::Couldn't find LOAF's index.html in this repo. Type LOAF's address when you run this."; exit 1; fi
            url="${base%/}/"; [ "$dir" != "." ] && url="${url}${dir}/"
          fi
          case "$url" in https://*) ;; *) echo "::error::The address must start with https://"; exit 1;; esac
          case "$url" in */) ;; *.html) ;; *) url="$url/";; esac
          echo "LOAF's address: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Check the signing key is there
        env:
          LOAF_KEYSTORE: ${{ secrets.LOAF_KEYSTORE }}
          LOAF_KEY_PASSWORD: ${{ secrets.LOAF_KEY_PASSWORD }}
        run: |
          if [ -z "$LOAF_KEYSTORE" ] || [ -z "$LOAF_KEY_PASSWORD" ]; then
            echo "::error::The two secrets LOAF_KEYSTORE and LOAF_KEY_PASSWORD are missing. See Part 2 of ANDROID-GUIDE.md."; exit 1; fi
          echo "$LOAF_KEYSTORE" | base64 -d > "$RUNNER_TEMP/loaf.jks"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's runners come with the Android SDK. If one ever doesn't, fetch Google's command-line tools.
      - name: Android 16 SDK
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          sm="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sm" ]; then
            echo "No Android SDK on this runner, fetching the command-line tools"
            mkdir -p "$sdk/cmdline-tools"
            curl -fsSL -o "$RUNNER_TEMP/tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q "$RUNNER_TEMP/tools.zip" -d "$RUNNER_TEMP/tools"
            rm -rf "$sdk/cmdline-tools/latest"; mv "$RUNNER_TEMP/tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          yes | "$sm" --licenses > /dev/null || true
          "$sm" --install "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build
        env:
          LOAF_KEYSTORE_FILE: ${{ runner.temp }}/loaf.jks
          LOAF_KEY_PASSWORD: ${{ secrets.LOAF_KEY_PASSWORD }}
        run: gradle -p android assembleRelease -PloafUrl="${{ steps.url.outputs.url }}" -PloafVersion=${{ github.run_number }}

      - name: Name the app file
        run: cp android/app/build/outputs/apk/release/app-release.apk "LOAF-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LOAF-app
          path: LOAF-${{ github.run_number }}.apk
